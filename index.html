<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>SMPTRU</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f6f8;color:#222}
body{display:flex;justify-content:center}
.app{width:100%;max-width:1100px;min-height:100vh;background:#f5f6f8}
header{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}
.logo{font-size:20px;font-weight:800}
.status{font-size:12px;color:#666}
main{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;padding:18px}
.card{background:#fff;border:1px solid #ddd;border-radius:22px;padding:20px}
.title{text-align:center;margin:0 0 16px;font-size:19px}
.input-wrap{position:relative}
input{width:100%;height:68px;background:#fff;border:1px solid #ccc;border-radius:16px;color:#222;text-align:center;font-size:38px;font-weight:700;outline:none}
input::placeholder{color:#999;font-size:18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{font:inherit;border:0;border-radius:14px;padding:13px;cursor:pointer;font-weight:700}
.actions button{height:82px}
.call{background:#22c55e;color:#fff}
.repeat{background:#e9ecef;color:#222}
.extra{background:#f59e0b;color:#fff;grid-column:1 / -1;height:64px}
.clear{background:#e9ecef;color:#222}
.reset{background:#8b1e1e;color:#fff}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:15px}
.key{height:94px;background:#f5f6f8;color:#222;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0}
.key:hover{background:#eef0f2}
.key:active{transform:scale(.95);background:#e2e5e8}
.num{font-size:43px;font-weight:400;line-height:43px}
.letters{font-size:14px;color:#777;margin-top:3px;letter-spacing:1px;min-height:16px}
.special .num{font-size:39px}
.display{background:#f8f9fa;border:1px solid #ddd;border-radius:20px;text-align:center;padding:25px 15px;margin-bottom:18px}
.display-label{color:#666;font-size:13px}
.display-number{font-size:105px;line-height:1;font-weight:800;margin:10px 0}
.display-text{color:#555;min-height:20px}
.history-title{display:flex;justify-content:space-between;align-items:center}
.history-title h3{margin:0}
.history-list{max-height:300px;overflow:auto;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid #e5e5e5}
.badge{font-size:11px;color:#8ee6a0}
.empty{color:#888;text-align:center;padding:20px}
.flash{animation:flash .5s ease 2}
@keyframes flash{50%{background:#e9ecef}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:12px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:5}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:750px){
 main{grid-template-columns:1fr;padding:10px}
 header{padding:15px}
 .card{padding:15px}
 .display-number{font-size:82px}
 .key{height:82px}
 .num{font-size:38px}
}

/* === TEMA DARK / TERANG === */
.theme-toggle{
  min-width:118px;height:44px;padding:8px 14px;border:1px solid #ccc;
  border-radius:12px;background:#fff;color:#222;font-weight:700;font-size:13px;
  cursor:pointer;transition:.2s;
}
.theme-toggle:hover{opacity:.88}
body.dark-mode,body.dark-mode .app{background:#111827;color:#f3f4f6}
body.dark-mode header{border-bottom-color:#374151}
body.dark-mode .status{color:#9ca3af}
body.dark-mode .card{background:#1f2937;border-color:#374151}
body.dark-mode input{background:#111827;border-color:#4b5563;color:#f3f4f6}
body.dark-mode input::placeholder{color:#9ca3af}
body.dark-mode .repeat,body.dark-mode .clear{background:#374151;color:#f3f4f6}
body.dark-mode .key{background:#374151;color:#f3f4f6}
body.dark-mode .key:hover{background:#4b5563}
body.dark-mode .key:active{background:#6b7280}
body.dark-mode .letters{color:#9ca3af}
body.dark-mode .display{background:#111827;border-color:#374151}
body.dark-mode .display-label,body.dark-mode .display-text{color:#9ca3af}
body.dark-mode .row{border-bottom-color:#374151}
body.dark-mode .empty{color:#9ca3af}
body.dark-mode .theme-toggle{background:#374151;border-color:#4b5563;color:#f9fafb}
@media(max-width:750px){
 .theme-toggle{min-width:104px;height:40px;font-size:12px;padding:7px 10px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <div class="logo">🔔 SMPTRU JOS JIS</div>
  </div>
  <button id="themeToggle" class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Ganti mode tampilan">🌙 DARK</button>
</header>

<main>
<section class="card">
  <h2 class="title">GAK ADA GEBRAKAN, KITA GEBRAKIN😋</h2>
  <div class="input-wrap">
    <input id="tableInput" type="text" inputmode="numeric" maxlength="3"
           placeholder="Masukkan Nomor Meja" autocomplete="off">
  </div>

  <div class="actions">
    <button class="repeat" onclick="repeatCall()">↻ PANGGIL ULANG</button>
    <button class="call" onclick="callTable()">🔔 PANGGIL MEJA</button>
    <button class="extra" onclick="extraMenuCall()">🍽️ TAMBAHAN MENU</button>
  </div>

  <div class="keypad">
    <button class="key" onclick="addNum(1)"><span class="num">1</span></button>
    <button class="key" onclick="addNum(2)"><span class="num">2</span></button>
    <button class="key" onclick="addNum(3)"><span class="num">3</span></button>
    <button class="key" onclick="addNum(4)"><span class="num">4</span></button>
    <button class="key" onclick="addNum(5)"><span class="num">5</span></button>
    <button class="key" onclick="addNum(6)"><span class="num">6</span></button>
    <button class="key" onclick="addNum(7)"><span class="num">7</span></button>
    <button class="key" onclick="addNum(8)"><span class="num">8</span></button>
    <button class="key" onclick="addNum(9)"><span class="num">9</span></button>
    <button class="key special" onclick="resetAll()" aria-label="Riset data"><span class="num">↻</span><span class="letters">RISET DATA</span></button>
    <button class="key" onclick="addNum(0)"><span class="num">0</span><span class="letters"></span></button>
    <button class="key special" onclick="backspace()" aria-label="Hapus satu digit"><span class="num">⌫</span><span class="letters">HAPUS</span></button>
  </div>
</section>

<section class="card" id="displayCard">
  <h2 class="title">MEJA YANG DIPANGGIL</h2>
  <div class="display">
    <div class="display-label">NOMOR MEJA</div>
    <div id="displayNumber" class="display-number">—</div>
    <div id="displayText" class="display-text">Silakan menunggu pemanggilan meja</div>
  </div>

  <div class="history-title">
    <h3>Riwayat Panggilan</h3>
    <span id="count" class="status">0 panggilan</span>
  </div>
  <div id="history" class="history-list"></div>
</section>
</main>
</div>

<div id="toast" class="toast"></div>

<script>
const input=document.getElementById('tableInput');
const displayNumber=document.getElementById('displayNumber');
const displayText=document.getElementById('displayText');
const historyEl=document.getElementById('history');
const displayCard=document.getElementById('displayCard');
const toast=document.getElementById('toast');

let current=localStorage.getItem('currentTable') || null;
let history=JSON.parse(localStorage.getItem('tableHistory') || '[]');

function save(){
  localStorage.setItem('tableHistory',JSON.stringify(history));
  if(current) localStorage.setItem('currentTable',current);
  render();
}

function render(){
  displayNumber.textContent=current || '—';
  displayText.textContent=current
    ? `silakan ambil pesanan Anda.`
    : 'Silakan menunggu pemanggilan meja';

  document.getElementById('count').textContent=history.length+' panggilan';

  historyEl.innerHTML=history.length
    ? history.map(x=>`<div class="row"><b>MEJA ${x}</b><span class="badge">✓ DIPANGGIL</span></div>`).join('')
    : '<div class="empty">Belum ada riwayat panggilan.</div>';
}

function addNum(n){
  if(input.value.length>=3) return;
  input.value += n;
}

function backspace(){
  input.value=input.value.slice(0,-1);
}

function clearInput(){
  input.value='';
}

function showToast(text){
  toast.textContent=text;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1800);
}

function playDoorbell(){
  try{
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    if(!AudioContext) return;

    const ctx=new AudioContext();

    const doorbellTone=(baseFreq, delay, duration, peak)=>{
      const t=ctx.currentTime+delay;
      const master=ctx.createGain();
      const compressor=ctx.createDynamicsCompressor();

      compressor.threshold.setValueAtTime(-18,t);
      compressor.knee.setValueAtTime(8,t);
      compressor.ratio.setValueAtTime(8,t);
      compressor.attack.setValueAtTime(0.003,t);
      compressor.release.setValueAtTime(0.15,t);

      master.gain.setValueAtTime(0.0001,t);
      master.gain.exponentialRampToValueAtTime(peak,t+0.006);
      master.gain.exponentialRampToValueAtTime(peak*0.62,t+0.10);
      master.gain.exponentialRampToValueAtTime(peak*0.28,t+0.32);
      master.gain.exponentialRampToValueAtTime(0.0001,t+duration);

      master.connect(compressor);
      compressor.connect(ctx.destination);

      [[1,0.62],[2.01,0.25],[3.02,0.11],[4.05,0.055],[5.08,0.025]].forEach(([ratio,amp])=>{
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();
        osc.type='sine';
        osc.frequency.setValueAtTime(baseFreq*ratio,t);
        gain.gain.setValueAtTime(amp,t);
        osc.connect(gain);
        gain.connect(master);
        osc.start(t);
        osc.stop(t+duration+0.08);
      });
    };

    doorbellTone(1046.5,0,0.78,1.35);
    doorbellTone(783.99,0.28,1.05,1.35);
  }catch(e){}
}

function speakText(text){
  if(!('speechSynthesis' in window)){
    showToast('Browser tidak mendukung suara otomatis');
    return;
  }

  speechSynthesis.cancel();

  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='id-ID';
    u.rate=1.05;
    u.pitch=1;
    u.volume=1;
    speechSynthesis.speak(u);
  },950);
}

function speak(n){
  playDoorbell();
  speakText(`Meja ${n}, silakan ambil pesanan Anda.`);
}

function extraMenuCall(){
  // Bisa langsung menggunakan nomor yang baru diinput,
  // atau menggunakan nomor meja aktif jika input kosong.
  const typed = parseInt(input.value,10);
  const n = typed && typed >= 1 && typed <= 999 ? String(typed) : current;

  if(!n){
    showToast('Masukkan nomor meja terlebih dahulu');
    return;
  }

  // Jika nomor baru diinput, jadikan sebagai meja aktif.
  if(typed){
    current = n;
    localStorage.setItem('currentTable', current);
    render();
    input.value='';
  }

  playDoorbell();
  speakText(`Tambahan menu meja ${n}.`);
  showToast('Tambahan menu meja '+n);
}

/* === PERINGATAN CLOSE ORDER 5 MENIT SEBELUM 23:00 === */
let closeOrderLastAlert = localStorage.getItem('closeOrderLastAlert') || '';

function closeOrderAlert(){
  const now = new Date();
  const hh = now.getHours();
  const mm = now.getMinutes();
  const today = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;

  // Hanya aktif tepat pada pukul 22:55 dan hanya sekali per hari.
  if(hh === 22 && mm === 55 && closeOrderLastAlert !== today){
    closeOrderLastAlert = today;
    localStorage.setItem('closeOrderLastAlert', today);

    const text = 'Perhatian!!, kepada seluruh pelanggan mie gacoan sumenep, 5 menit lagi waktu pemesanan akan ditutup. Harap segera melakukan pembayaran atas pesanan Anda. Terima kasih';
    showToast('⚠️ 5 MENIT LAGI CLOSE ORDER');

    // Gunakan bel yang sama seperti panggilan meja.
    playDoorbell();

    // Suara pengumuman setelah bel.
    setTimeout(()=>{
      if('speechSynthesis' in window){
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'id-ID';
        u.rate = 1.0;
        u.pitch = 1;
        u.volume = 1;
        speechSynthesis.speak(u);
      }
    }, 950);
  }
}

// Cek setiap detik agar peringatan tetap muncul meskipun halaman sudah lama terbuka.
setInterval(closeOrderAlert, 1000);
closeOrderAlert();

function callTable(){
  const n=parseInt(input.value,10);

  if(!n || n<1 || n>999){
    showToast('Masukkan nomor meja 1 - 999');
    return;
  }

  current=String(n);
  history=[current,...history.filter(x=>x!==current)].slice(0,30);
  save();

  displayCard.classList.remove('flash');
  void displayCard.offsetWidth;
  displayCard.classList.add('flash');

  showToast('Memanggil meja '+current);
  speak(current);
  input.value='';
}

function repeatCall(){
  if(!current){
    showToast('Belum ada meja yang dipanggil');
    return;
  }
  speak(current);
  showToast('Panggilan ulang meja '+current);
}

function resetAll(){
  if(!confirm('Hapus nomor aktif dan seluruh riwayat?')) return;
  current=null;
  history=[];
  localStorage.removeItem('currentTable');
  localStorage.removeItem('tableHistory');
  input.value='';
  render();
  showToast('Data telah direset');
}

input.addEventListener('keydown',e=>{
  if(e.key==='Enter') callTable();
  if(e.key==='Backspace') return;
});

render();

/* === TEMA DARK / TERANG === */
(function(){
  const savedTheme = localStorage.getItem('smptruTheme');
  if(savedTheme === 'dark') document.body.classList.add('dark-mode');

  window.updateThemeButton = function(){
    const btn = document.getElementById('themeToggle');
    if(!btn) return;
    const dark = document.body.classList.contains('dark-mode');
    btn.textContent = dark ? '☀️ TERANG' : '🌙 DARK';
    btn.setAttribute('aria-label', dark ? 'Gunakan mode terang' : 'Gunakan mode gelap');
  };

  window.toggleTheme = function(){
    document.body.classList.toggle('dark-mode');
    localStorage.setItem(
      'smptruTheme',
      document.body.classList.contains('dark-mode') ? 'dark' : 'light'
    );
    updateThemeButton();
  };

  updateThemeButton();
})();
</script>
</body>
</html>
