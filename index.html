<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>SMPTRU</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#000;color:#fff}
body{display:flex;justify-content:center}
.app{width:100%;max-width:1100px;min-height:100vh;background:#000}
header{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{font-size:20px;font-weight:800}
.status{font-size:12px;color:#aaa}
main{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;padding:18px}
.card{background:#111;border:1px solid #222;border-radius:22px;padding:20px}
.title{text-align:center;margin:0 0 16px;font-size:19px}
.input-wrap{position:relative}
input{width:100%;height:68px;background:#050505;border:1px solid #333;border-radius:16px;color:#fff;text-align:center;font-size:38px;font-weight:700;outline:none}
input::placeholder{color:#555;font-size:18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{font:inherit;border:0;border-radius:14px;padding:13px;cursor:pointer;font-weight:700}
.call{background:#fff;color:#000}
.repeat{background:#272727;color:#fff}
.clear{background:#272727;color:#fff}
.reset{background:#8b1e1e;color:#fff}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:15px}
.key{height:94px;background:#000;color:#fff;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0}
.key:hover{background:#181818}
.key:active{transform:scale(.95);background:#222}
.num{font-size:43px;font-weight:400;line-height:43px}
.letters{font-size:14px;color:#777;margin-top:3px;letter-spacing:1px;min-height:16px}
.special .num{font-size:39px}
.display{background:#050505;border:1px solid #292929;border-radius:20px;text-align:center;padding:25px 15px;margin-bottom:18px}
.display-label{color:#888;font-size:13px}
.display-number{font-size:105px;line-height:1;font-weight:800;margin:10px 0}
.display-text{color:#ccc;min-height:20px}
.history-title{display:flex;justify-content:space-between;align-items:center}
.history-title h3{margin:0}
.history-list{max-height:300px;overflow:auto;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid #252525}
.badge{font-size:11px;color:#8ee6a0}
.empty{color:#666;text-align:center;padding:20px}
.flash{animation:flash .5s ease 2}
@keyframes flash{50%{background:#333}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#fff;color:#000;padding:12px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:5}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:750px){
 main{grid-template-columns:1fr;padding:10px}
 header{padding:15px}
 .card{padding:15px}
 .display-number{font-size:82px}
 .key{height:82px}
 .num{font-size:38px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">🔔 SMPTRU JOS JIS</div>
</header>

<main>
<section class="card">
  <h2 class="title">MASUKKAN NOMOR MEJA</h2>

  <div class="input-wrap">
    <input id="tableInput" type="text" inputmode="numeric" maxlength="3"
           placeholder="Masukkan Nomor Meja" autocomplete="off">
  </div>

  <div class="actions">
    <button class="repeat" onclick="repeatCall()">↻ PANGGIL ULANG</button>
    <button class="call" onclick="callTable()">🔔 PANGGIL MEJA</button>
    <button class="reset" onclick="resetAll()">RESET DATA</button>
    <button class="#" onclick="#">SEMANGAT YA 💪</button>
  </div>

  <div class="keypad">
    <button class="key" onclick="addNum(1)"><span class="num">1</span></button>
    <button class="key" onclick="addNum(2)"><span class="num">2</span></button>
    <button class="key" onclick="addNum(3)"><span class="num">3</span></button>
    <button class="key" onclick="addNum(4)"><span class="num">4</span></button>
    <button class="key" onclick="addNum(5)"><span class="num">5</span></button>
    <button class="key" onclick="addNum(6)"><span class="num">6</span></button>
    <button class="key" onclick="addNum(7)"><span class="num">7</span></button>
    <button class="key" onclick="addNum(8)"><span class="num">8</span></button>
    <button class="key" onclick="addNum(9)"><span class="num">9</span></button>
    <button class="key special" onclick="clearInput()"><span class="num"></span><span class="letters"></span></button>
    <button class="key" onclick="addNum(0)"><span class="num">0</span><span class="letters">+</span></button>
    <button class="key special" onclick="callTable()"><span class="num"></span><span class="etters"></span></button>
  </div>
</section>

<section class="card" id="displayCard">
  <h2 class="title">MEJA YANG DIPANGGIL</h2>
  <div class="display">
    <div class="display-label">NOMOR MEJA</div>
    <div id="displayNumber" class="display-number">—</div>
    <div id="displayText" class="display-text">Silakan menunggu pemanggilan meja</div>
  </div>

  <div class="history-title">
    <h3>Riwayat Panggilan</h3>
    <span id="count" class="status">0 panggilan</span>
  </div>
  <div id="history" class="history-list"></div>
</section>
</main>
</div>

<div id="toast" class="toast"></div>

<script>
const input=document.getElementById('tableInput');
const displayNumber=document.getElementById('displayNumber');
const displayText=document.getElementById('displayText');
const historyEl=document.getElementById('history');
const displayCard=document.getElementById('displayCard');
const toast=document.getElementById('toast');

let current=localStorage.getItem('currentTable') || null;
let history=JSON.parse(localStorage.getItem('tableHistory') || '[]');

function save(){
  localStorage.setItem('tableHistory',JSON.stringify(history));
  if(current) localStorage.setItem('currentTable',current);
  render();
}

function render(){
  displayNumber.textContent=current || '—';
  displayText.textContent=current
    ? `Meja nomor ${current}, silakan ambil pesanan Anda.`
    : 'Silakan menunggu pemanggilan meja';

  document.getElementById('count').textContent=history.length+' panggilan';

  historyEl.innerHTML=history.length
    ? history.map(x=>`<div class="row"><b>MEJA ${x}</b><span class="badge">✓ DIPANGGIL</span></div>`).join('')
    : '<div class="empty">Belum ada riwayat panggilan.</div>';
}

function addNum(n){
  if(input.value.length>=3) return;
  input.value += n;
}

function backspace(){
  input.value=input.value.slice(0,-1);
}

function clearInput(){
  input.value='';
}

function showToast(text){
  toast.textContent=text;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1800);
}

function speak(n){
  if(!('speechSynthesis' in window)){
    showToast('Browser tidak mendukung suara otomatis');
    return;
  }

  speechSynthesis.cancel();

  // Bunyi notifikasi singkat menggunakan Web Audio
  try{
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    if(AudioContext){
      const ctx=new AudioContext();
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.frequency.value=880;
      gain.gain.value=.07;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime+.18);
    }
  }catch(e){}

  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(
      `Meja nomor ${n}, silakan ambil pesanan Anda.`
    );
    u.lang='id-ID';
    u.rate=.88;
    u.pitch=1;
    u.volume=1;
    speechSynthesis.speak(u);
  },220);
}

function callTable(){
  const n=parseInt(input.value,10);

  if(!n || n<1 || n>999){
    showToast('Masukkan nomor meja 1 - 999');
    return;
  }

  current=String(n);
  history=[current,...history.filter(x=>x!==current)].slice(0,30);
  save();

  displayCard.classList.remove('flash');
  void displayCard.offsetWidth;
  displayCard.classList.add('flash');

  showToast('Memanggil meja '+current);
  speak(current);
  input.value='';
}

function repeatCall(){
  if(!current){
    showToast('Belum ada meja yang dipanggil');
    return;
  }
  speak(current);
  showToast('Panggilan ulang meja '+current);
}

function resetAll(){
  if(!confirm('Hapus nomor aktif dan seluruh riwayat?')) return;
  current=null;
  history=[];
  localStorage.removeItem('currentTable');
  localStorage.removeItem('tableHistory');
  input.value='';
  render();
  showToast('Data telah direset');
}

input.addEventListener('keydown',e=>{
  if(e.key==='Enter') callTable();
  if(e.key==='Backspace') return;
});

render();
</script>
</body>
</html></body>
</html>
