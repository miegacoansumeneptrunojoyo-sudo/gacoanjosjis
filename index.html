<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMPTRU</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
header{background:#111827;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:18px}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 5px 20px #0001}
.current{text-align:center}.label{font-size:14px;color:#6b7280}.number{font-size:86px;font-weight:800;margin:8px 0 18px}
input,button{font:inherit;border-radius:12px;border:1px solid #d1d5db;padding:12px}input{width:100%}
button{cursor:pointer;background:#111827;color:white;border:0;font-weight:700}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.secondary{background:#e5e7eb;color:#111827}.danger{background:#dc2626}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:15px}.keypad button{padding:14px;background:#eef2ff;color:#111827}
.history{max-height:430px;overflow:auto}.row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #eee}
.badge{font-size:12px;background:#dcfce7;color:#166534;padding:5px 8px;border-radius:99px}
.display{background:#111827;color:white;border-radius:18px;padding:28px;text-align:center}.display .number{font-size:110px;margin:5px 0}.display p{color:#d1d5db}
@media(max-width:750px){.grid{grid-template-columns:1fr}.number{font-size:64px}.display .number{font-size:82px}.keypad{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>🔔 SUMENEP TRUNOJOYO</h1></header>
<div class="wrap">
<div class="grid">
<section class="card">
<h2><center>SMPTRU JOS JIS</center>center></h2>
<input id="tableInput" type="number" min="1" max="999" placeholder="Masukkan Nomor Meja">
<div class="btns">
<button onclick="callTable()">🔔 Panggil Meja</button>
<button class="secondary" onclick="repeatCall()">↻ Panggil Ulang</button>
<button class="danger" onclick="backspace()"><center>⌫ Hapus Angka</center>center</button>
</div>
<div class="keypad">
<button onclick="addNum(1)">1</button><button onclick="addNum(2)">2</button><button onclick="addNum(3)">3</button><button onclick="addNum(4)">4</button><button onclick="addNum(5)">5</button>
<button onclick="addNum(6)">6</button><button onclick="addNum(7)">7</button><button onclick="addNum(8)">8</button><button onclick="addNum(9)">9</button><button onclick="addNum(0)">0</button>
</div>
</section>
<section class="card">
<h2><center>MEJA YANG DIPANGGIL</center></h2>
<div class="display"><div id="displayNumber" class="number">—</div><p id="displayText">Silakan menunggu pemanggilan meja</p></div>
<h3>Riwayat Pemanggilan</h3>
<div id="history" class="history"></div>
</section>
</div>
</div>
<script>
let current=null, history=JSON.parse(localStorage.getItem('tableHistory')||'[]');
const input=document.getElementById('tableInput');
function save(){localStorage.setItem('tableHistory',JSON.stringify(history));render()}
function render(){
 document.getElementById('displayText').textContent=current?`Panggilan meja ${current}`:'Belum Ada Panggilan Meja';
 document.getElementById('history').innerHTML=history.map(x=>`<div class="row"><b>MEJA ${x}</b><span class="badge">Dipanggil</span></div>`).join('')||'<div class="label">Belum ada riwayat.</div>';
 document.getElementById('displayNumber').textContent=current??'—';
}
function speak(n){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(`Meja nomor ${n}, silakan ambil pesanan anda.`);u.lang='id-ID';u.rate=.9;speechSynthesis.speak(u)}}
function callTable(){let n=parseInt(input.value);if(!n)return alert('Masukkan nomor meja.');current=n;history=[n,...history.filter(x=>x!==n)].slice(0,30);save();speak(n)}
function repeatCall(){if(current==null)return alert('Belum ada meja yang dipanggil.');speak(current)}
function nextTable(){if(current==null){input.value=1}else input.value=current+1;callTable()}
function addNum(n){input.value=(input.value||'')+n}
function backspace(){input.value=input.value.slice(0,-1)}
function clearHistory(){if(confirm('Hapus semua riwayat?')){history=[];save()}}
render();
</script>
</body>
</html>
